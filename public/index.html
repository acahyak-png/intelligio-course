<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bimbel Ceria — Les Privat</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#FFF9F0; --card:#fff; --text:#3F3D56; --muted:#8B8AA5;
    --orange:#FF9F43; --orange-d:#F39C12; --mint:#4ECDC4; --coral:#FF6B6B;
    --yellow:#FFD93D; --purple:#A78BFA; --border:#F1E8DC;
    --shadow:0 8px 24px rgba(63,61,86,.08); --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
  h1,h2,h3{font-family:'Baloo 2',sans-serif;line-height:1.25}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:.95rem}

  /* LOGIN */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;
    background:radial-gradient(circle at 15% 20%,#FFF1D6,transparent 45%),
               radial-gradient(circle at 85% 80%,#E0FBF7,transparent 45%),#FFF9F0}
  .float-emoji{position:absolute;font-size:2.6rem;opacity:.75;user-select:none;animation:floaty 6s ease-in-out infinite;z-index:1}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-20px) rotate(5deg)}}
  .login-card{background:#fff;border-radius:28px;padding:40px 34px;width:100%;max-width:400px;
    box-shadow:0 20px 60px rgba(63,61,86,.12);position:relative;z-index:2;text-align:center}
  .login-logo{font-size:3rem}
  .login-title{font-size:1.9rem;margin:6px 0 4px}
  .login-sub{color:var(--muted);font-size:.9rem;margin-bottom:24px}
  .field{text-align:left;margin-bottom:14px}
  .field label{display:block;font-weight:800;font-size:.82rem;margin-bottom:6px;color:#5a5876}
  .field input,.field select,.field textarea{width:100%;padding:11px 14px;border:2px solid var(--border);
    border-radius:12px;background:#fff;transition:.2s;color:var(--text)}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 4px #FF9F4322}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .login-err{color:var(--coral);font-size:.85rem;font-weight:700;min-height:20px;margin-bottom:8px}
  .demo-box{margin-top:20px;background:#FFF9F0;border:1.5px dashed #F1D9B8;border-radius:14px;
    padding:12px 16px;font-size:.8rem;color:var(--muted);text-align:left;line-height:1.7}
  .demo-box b{color:var(--text)}

  /* BUTTONS */
  .btn{padding:11px 20px;border-radius:12px;font-weight:800;font-size:.92rem;transition:.2s;display:inline-flex;
    align-items:center;gap:6px;justify-content:center}
  .btn-primary{background:linear-gradient(135deg,#FFB84D,#FF9F43);color:#fff;box-shadow:0 6px 16px #FF9F4355}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 22px #FF9F4366}
  .btn-ghost{background:#fff;border:2px solid var(--border);color:var(--text)}
  .btn-ghost:hover{border-color:#E5D5BE;background:#FFFDFA}
  .btn-mint{background:var(--mint);color:#fff;box-shadow:0 6px 16px #4ECDC455}
  .btn-sm{padding:7px 14px;font-size:.82rem;border-radius:10px}
  .btn-full{width:100%}
  .btn-icon{width:36px;height:36px;border-radius:10px;background:#F7F3EE;display:flex;align-items:center;
    justify-content:center;font-size:1rem;transition:.2s}
  .btn-icon:hover{background:#EFE8DE}

  /* TOPBAR */
  .topbar{background:#fff;border-bottom:2px solid var(--border);padding:14px 24px;display:flex;
    justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
  .brand{font-family:'Baloo 2';font-weight:800;font-size:1.25rem;color:var(--orange-d)}
  .topbar-right{display:flex;align-items:center;gap:16px}
  .user-chip{display:flex;align-items:center;gap:10px}
  .user-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#FFD93D,#FF9F43);
    color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;font-size:1.1rem}
  .user-name{font-weight:800;font-size:.9rem;line-height:1.2}
  .user-role{font-size:.72rem;color:var(--muted);font-weight:700}
  .mode-badge{font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:999px;background:#E0FBF7;color:#0E9F6E}
  .mode-badge.local{background:#FFF3E0;color:#B26B00}

  /* LAYOUT */
  .container{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
  .hero-banner{background:linear-gradient(120deg,#FFB84D,#FF9F43 60%,#FF8A65);color:#fff;
    border-radius:24px;padding:28px 32px;display:flex;justify-content:space-between;align-items:center;
    position:relative;overflow:hidden;margin-bottom:22px;box-shadow:0 12px 30px #FF9F4344}
  .hero-banner::before,.hero-banner::after{content:"";position:absolute;border-radius:50%;background:#ffffff22}
  .hero-banner::before{width:180px;height:180px;top:-70px;right:60px}
  .hero-banner::after{width:120px;height:120px;bottom:-50px;right:-20px}
  .hero-banner h1{font-size:1.7rem;position:relative}
  .hero-banner p{opacity:.95;font-size:.92rem;margin-top:4px;position:relative}
  .hero-emoji{font-size:3.4rem;position:relative;z-index:2}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
  .stat-card{background:#fff;border-radius:var(--radius);padding:16px 18px;display:flex;gap:14px;
    align-items:center;box-shadow:var(--shadow)}
  .stat-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
  .stat-num{font-family:'Baloo 2';font-size:1.5rem;font-weight:800;line-height:1.1}
  .stat-label{font-size:.8rem;color:var(--muted);font-weight:700}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .tab{padding:10px 18px;border-radius:999px;background:#fff;border:2px solid var(--border);
    font-weight:800;font-size:.88rem;color:var(--muted);transition:.2s}
  .tab:hover{border-color:#E5D5BE}
  .tab.active{background:linear-gradient(135deg,#FFB84D,#FF9F43);color:#fff;border-color:transparent;
    box-shadow:0 6px 16px #FF9F4344}

  .section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;
    margin:0 0 16px;flex-wrap:wrap}
  .section-head h2{font-size:1.3rem}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .panel{background:#fff;border-radius:20px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
  .panel-title{font-size:1.15rem;margin-bottom:4px}
  .panel-sub{font-size:.85rem;color:var(--muted);margin-bottom:14px}
  .muted{color:var(--muted);font-size:.85rem}
  .empty{text-align:center;padding:36px 16px;color:var(--muted);font-weight:700}
  .empty .big{font-size:2.4rem;display:block;margin-bottom:8px}

  /* CHART */
  .chart-wrap{position:relative;height:240px;margin-bottom:18px;padding:8px 4px;background:#FFFDF9;
    border-radius:14px;border:1.5px solid var(--border)}

  /* STUDENT */
  .student-card{background:#fff;border-radius:var(--radius);padding:18px;display:flex;gap:14px;
    align-items:flex-start;box-shadow:var(--shadow);transition:.2s}
  .student-card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(63,61,86,.12)}
  .avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:'Baloo 2';font-weight:800;font-size:1.3rem;flex-shrink:0}
  .student-info{flex:1;min-width:0}
  .student-info h3{font-size:1.05rem;margin-bottom:6px}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .chip{font-size:.72rem;font-weight:800;background:#FFF3E0;color:#B26B00;padding:3px 10px;border-radius:999px}
  .student-meta{font-size:.82rem;color:var(--muted);font-weight:600}
  .card-actions{display:flex;flex-direction:column;gap:6px}

  /* TIMELINE */
  .timeline{display:flex;flex-direction:column}
  .timeline-item{display:flex;gap:14px;padding:16px 0;border-bottom:1.5px dashed var(--border)}
  .timeline-item:last-child{border-bottom:none;padding-bottom:0}
  .timeline-dot{width:12px;height:12px;border-radius:50%;margin-top:7px;flex-shrink:0}
  .timeline-body{flex:1;min-width:0}
  .timeline-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .timeline-topic{font-weight:800;font-size:1rem}
  .timeline-date{font-size:.78rem;color:var(--muted);font-weight:700;margin-top:2px}
  .score-badge{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2';font-weight:800;font-size:1.15rem;flex-shrink:0}
  .timeline-note{font-size:.85rem;color:#6b6989;margin-top:8px;background:#FFF9F0;padding:8px 12px;border-radius:10px}
  .link-danger{font-size:.78rem;font-weight:800;color:var(--coral);margin-top:6px}

  /* INVOICE */
  .invoice-card{background:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
  .invoice-top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .invoice-month{font-family:'Baloo 2';font-weight:800;font-size:1.05rem}
  .invoice-meta{font-size:.8rem;color:var(--muted);font-weight:600;margin-top:2px}
  .invoice-right{text-align:right}
  .invoice-amount{font-family:'Baloo 2';font-weight:800;font-size:1.15rem;color:var(--orange-d)}
  .badge{display:inline-block;font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:999px;margin-top:4px}
  .badge-unpaid{background:#FFE9E9;color:#E02424}
  .badge-pending{background:#FFF7DB;color:#B7791F}
  .badge-paid{background:#E6FBF4;color:#0E9F6E}
  .invoice-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(63,61,86,.45);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
  .modal-overlay.hidden{display:none}
  .modal-card{background:#fff;border-radius:24px;padding:26px;width:100%;max-width:520px;
    max-height:90vh;overflow:auto;animation:pop .22s ease}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-title{font-size:1.35rem;margin-bottom:16px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .form-subtitle{font-size:1rem;margin:18px 0 10px;padding-top:14px;border-top:1.5px dashed var(--border)}

  .two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}

  @media(max-width:820px){
    .two-col{grid-template-columns:1fr}
    .hero-banner h1{font-size:1.35rem}
    .hero-emoji{font-size:2.4rem}
    .field-row{grid-template-columns:1fr}
    .topbar{padding:12px 16px}
    .user-name{display:none}
  }

  /* ============ PRINT ============ */
  #printArea{display:none}
  @media print {
    body > *:not(#printArea){display:none !important}
    #printArea{display:block !important;padding:0}
    @page{margin:16mm}
    .print-invoice{font-family:'Nunito',sans-serif;color:#3F3D56;font-size:12pt}
    .print-invoice h1{font-family:'Baloo 2',sans-serif;color:#FF9F43;font-size:22pt;margin:0 0 4px}
    .print-invoice h2{font-family:'Baloo 2',sans-serif;font-size:16pt;letter-spacing:2px;margin:0}
    .print-invoice h3{font-size:11pt;margin:0 0 4px;color:#8B8AA5;text-transform:uppercase;letter-spacing:1px}
    .print-invoice p{margin:2px 0}
    .print-invoice small{font-size:9pt;color:#8B8AA5}
    .print-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:3px solid #FF9F43;padding-bottom:14px;margin-bottom:20px}
    .print-head-r{text-align:right}
    .print-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
    .print-table{width:100%;border-collapse:collapse;margin-bottom:20px}
    .print-table th{background:#FFF3E0;text-align:left;padding:10px 12px;font-size:10pt;color:#B26B00;border-bottom:2px solid #FFE0B5}
    .print-table td{padding:12px;border-bottom:1px solid #F1E8DC;vertical-align:top}
    .print-total td{background:#FFF9F0;font-size:13pt;padding:12px;border:none}
    .print-status{margin:16px 0;padding:10px 14px;border-radius:8px;font-size:11pt;font-weight:800;text-align:center}
    .print-status-unpaid{background:#FFE9E9;color:#E02424}
    .print-status-pending{background:#FFF7DB;color:#B7791F}
    .print-status-paid{background:#E6FBF4;color:#0E9F6E}
    .print-foot{margin-top:24px;padding-top:14px;border-top:1px dashed #F1E8DC;text-align:center}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>

<script>
/* ============ KONFIGURASI BACKEND ============ */
const API_URL = (location.protocol === 'file:' || location.port === '')
  ? '/api' : `${location.origin}/api`;
let USE_BACKEND = true;

/* ============ HELPERS ============ */
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtRp = n => 'Rp ' + Number(n).toLocaleString('id-ID');
const fmtDate = s => new Date(s + 'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
const today = () => new Date().toISOString().slice(0,10);
function scoreColor(n){
  if (n >= 85) return {bg:'#E6FBF4', color:'#0E9F6E'};
  if (n >= 70) return {bg:'#FFF7DB', color:'#B7791F'};
  return {bg:'#FFE9E9', color:'#E02424'};
}
const AV_COLORS = ['#FF9F43','#4ECDC4','#A78BFA','#FF6B6B','#5B8DEF','#F4A261'];
const avatarColor = id => AV_COLORS[id % AV_COLORS.length];

/* ============ DATABASE ============ */
const DB_KEY = 'bimbel_ceria_v1';
function seedData(){
  return {
    users:[
      {username:'admin', password:'admin123', role:'admin', name:'Admin Bimbel'},
      {username:'orangtua1', password:'ortu123', role:'parent', name:'Ibu Sari', studentId:1},
      {username:'orangtua2', password:'ortu123', role:'parent', name:'Bapak Andi', studentId:2},
    ],
    students:[
      {id:1, name:'Adi Pratama', grade:'SD Kelas 5', subject:'Matematika & IPA', teacher:'Kak Rina', schedule:'Senin & Kamis, 15.00'},
      {id:2, name:'Nadia Putri', grade:'SMP Kelas 7', subject:'Bahasa Inggris', teacher:'Kak Dita', schedule:'Selasa & Jumat, 16.00'},
    ],
    progress:[
      {id:1, studentId:1, date:'2026-10-20', topic:'Operasi Pecahan', score:82, note:'Sudah paham konsep dasar, perlu latihan soal cerita.'},
      {id:2, studentId:1, date:'2026-10-27', topic:'Bangun Datar', score:88, note:'Sangat baik, aktif bertanya.'},
      {id:3, studentId:1, date:'2026-11-03', topic:'Satuan Panjang & Berat', score:90, note:'Peningkatan pesat, pertahankan!'},
      {id:4, studentId:2, date:'2026-10-21', topic:'Tenses: Present Simple', score:78, note:'Perlu latihan verb -s/-es.'},
      {id:5, studentId:2, date:'2026-10-28', topic:'Reading Comprehension', score:85, note:'Kosakata bertambah baik.'},
    ],
    invoices:[
      {id:1, studentId:1, month:'Oktober 2026', sessions:8, amount:600000, status:'paid', dueDate:'2026-10-10'},
      {id:2, studentId:1, month:'November 2026', sessions:8, amount:600000, status:'unpaid', dueDate:'2026-11-10'},
      {id:3, studentId:2, month:'November 2026', sessions:8, amount:640000, status:'pending', dueDate:'2026-11-10'},
    ],
    nextIds:{student:3, progress:6, invoice:4}
  };
}
let db = null;

/* ============ LOAD / SAVE (BACKEND + LOCAL) ============ */
async function loadDB(){
  if (USE_BACKEND){
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 2500);
      const r = await fetch(API_URL + '/state', {signal: ctrl.signal});
      clearTimeout(timer);
      if (r.ok){
        const data = await r.json();
        if (data && !data.empty && data.users){
          db = data;
          localStorage.setItem(DB_KEY, JSON.stringify(db));
          return;
        }
        // backend kosong → seed
        db = seedData();
        saveDB();
        return;
      }
    } catch (e){
      console.warn('Backend tidak tersedia, fallback ke localStorage.', e.message);
      USE_BACKEND = false;
    }
  }
  const raw = localStorage.getItem(DB_KEY);
  if (raw){ db = JSON.parse(raw); return; }
  db = seedData(); saveDB();
}

function saveDB(){
  // cache lokal (fallback / offline)
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch {}
  if (!USE_BACKEND) return;
  fetch(API_URL + '/state', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(db)
  }).catch(() => {
    console.warn('Gagal simpan ke backend, data tetap aman di localStorage.');
    USE_BACKEND = false;
    render();
  });
}

/* ============ STATE ============ */
let session = null;
let adminTab = 'siswa';
let selectedStudent = null;
const studentById = id => db.students.find(s => s.id === id);

/* ============ RENDER ============ */
let chartInstance = null;
function render(){
  const app = document.getElementById('app');
  app.innerHTML = session ? appHTML() : loginHTML();
  // Init chart setelah DOM terpasang
  requestAnimationFrame(() => {
    if (!session) return;
    if (session.role === 'parent') initParentChart();
    if (session.role === 'admin' && adminTab === 'monitoring') initAdminChart();
  });
}

/* ---- LOGIN ---- */
function loginHTML(){
  return `
    <div class="login-wrap">
      <span class="float-emoji" style="top:12%;left:10%;animation-delay:0s">✏️</span>
      <span class="float-emoji" style="top:20%;right:12%;animation-delay:1.2s">📚</span>
      <span class="float-emoji" style="bottom:15%;left:15%;animation-delay:.6s">🎨</span>
      <span class="float-emoji" style="bottom:12%;right:14%;animation-delay:1.8s">⭐</span>
      <div class="login-card">
        <div class="login-logo">🎓</div>
        <h1 class="login-title">Bimbel Ceria</h1>
        <p class="login-sub">Belajar jadi menyenangkan, progres jadi terpantau!</p>
        <form onsubmit="login(event)">
          <div class="field"><label>Username</label>
            <input id="loginUser" placeholder="masukkan username" autocomplete="username" required></div>
          <div class="field"><label>Password</label>
            <input id="loginPass" type="password" placeholder="masukkan password" autocomplete="current-password" required></div>
          <div class="login-err" id="loginErr"></div>
          <button type="submit" class="btn btn-primary btn-full">Masuk 🚀</button>
        </form>
        <div class="demo-box">
          <b>Akun demo:</b><br>
          🛠 Admin — <b>admin</b> / <b>admin123</b><br>
          👪 Orang Tua (Adi) — <b>orangtua1</b> / <b>ortu123</b><br>
          👪 Orang Tua (Nadia) — <b>orangtua2</b> / <b>ortu123</b>
        </div>
      </div>
    </div>`;
}
function login(e){
  e.preventDefault();
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const found = db.users.find(x => x.username === u && x.password === p);
  const err = document.getElementById('loginErr');
  if (!found){ err.textContent = 'Username atau password salah 😅'; return; }
  session = found;
  sessionStorage.setItem('bimbel_session', u);
  adminTab = 'siswa'; selectedStudent = null;
  render();
}
function logout(){
  session = null;
  sessionStorage.removeItem('bimbel_session');
  render();
}

/* ---- APP SHELL ---- */
function appHTML(){
  return `
    <header class="topbar">
      <div class="brand">🎓 Bimbel Ceria</div>
      <div class="topbar-right">
        <span class="mode-badge ${USE_BACKEND ? '' : 'local'}">${USE_BACKEND ? '☁️ Backend' : '💾 Lokal'}</span>
        <div class="user-chip">
          <span class="user-avatar">${esc(session.name[0])}</span>
          <div>
            <div class="user-name">${esc(session.name)}</div>
            <div class="user-role">${session.role === 'admin' ? 'Admin' : 'Orang Tua'}</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Keluar</button>
      </div>
    </header>
    <main class="container">
      ${session.role === 'admin' ? adminHTML() : parentHTML()}
    </main>
    <div id="modal" class="modal-overlay hidden"><div class="modal-card" id="modalContent"></div></div>`;
}

/* ================= ADMIN ================= */
function adminHTML(){
  const unpaid = db.invoices.filter(i => i.status !== 'paid');
  const unpaidTotal = unpaid.reduce((a,b) => a + b.amount, 0);
  return `

/* ================= CHART ================= */
function drawChart(items){
  const canvas = document.getElementById('scoreChart');
  if (!canvas || typeof Chart === 'undefined') return;
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  const sorted = [...items].sort((a,b) => a.date.localeCompare(b.date));
  chartInstance = new Chart(canvas, {
    type: 'line',
    data: {
      labels: sorted.map(p => fmtDate(p.date)),
      datasets: [{
        label: 'Nilai',
        data: sorted.map(p => p.score),
        borderColor: '#FF9F43',
        backgroundColor: 'rgba(255,159,67,0.15)',
        tension: 0.35,
        fill: true,
        pointBackgroundColor: '#FF9F43',
        pointBorderColor: '#fff',
        pointBorderWidth: 2,
        pointRadius: 5,
        pointHoverRadius: 7,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#3F3D56',
          padding: 10,
          cornerRadius: 8,
          callbacks: {
            label: ctx => `Nilai: ${ctx.parsed.y}`
          }
        }
      },
      scales: {
        y: {
          min: 0, max: 100,
          ticks: { stepSize: 20, color: '#8B8AA5' },
          grid: { color: '#F1E8DC' }
        },
        x: {
          ticks: { color: '#8B8AA5', maxRotation: 0, autoSkipPadding: 12 },
          grid: { display: false }
        }
      }
    }
  });
}
function initParentChart(){
  const items = db.progress.filter(p => p.studentId === session.studentId);
  drawChart(items);
}

  const items = db.progress.filter(p => p.studentId === sid);

function saveStudent(e){
  e.preventDefault();
  const f = e.target;
  const id = f.dataset.id ? Number(f.dataset.id) : null;
  const data = {
    name: f.sname.value.trim(),
    grade: f.grade.value.trim(),
    subject: f.subject.value.trim(),
    teacher: f.teacher.value.trim(),
    schedule: f.schedule.value.trim(),
  };
  const pName = f.pname.value.trim();
  const pUser = f.puser.value.trim();
  const pPass = f.ppass.value.trim();

  if (pUser){
    const conflict = db.users.find(u => u.username === pUser && !(id && u.role==='parent' && u.studentId === id));
    if (conflict){ alert('Username sudah dipakai. Pilih username lain ya.'); return; }
  }

  if (id){
    Object.assign(studentById(id), data);
    let parent = db.users.find(u => u.role === 'parent' && u.studentId === id);
    if (pName){
      if (parent){
        parent.name = pName;
        if (pUser) parent.username = pUser;
        if (pPass) parent.password = pPass;
      } else if (pUser && pPass){
        db.users.push({username:pUser, password:pPass, role:'parent', name:pName, studentId:id});
      }
    }
  } else {
    const newId = db.nextIds.student++;
    db.students.push({id:newId, ...data});
    if (pUser && pPass){
      db.users.push({username:pUser, password:pPass, role:'parent', name:pName || 'Orang Tua', studentId:newId});
    }
  }
  saveDB(); closeModal(); render();
}

function deleteStudent(id){
  const s = studentById(id);
  if (!confirm(`Hapus siswa "${s.name}" beserta seluruh catatan progres, invoice, dan akun orang tuanya?`)) return;
  db.students = db.students.filter(x => x.id !== id);
  db.progress = db.progress.filter(p => p.studentId !== id);
  db.invoices = db.invoices.filter(i => i.studentId !== id);
  db.users = db.users.filter(u => !(u.role === 'parent' && u.studentId === id));
  if (selectedStudent === id) selectedStudent = null;
  saveDB(); render();
}

    dueDate: f.dueDate.value,
  });
  saveDB(); closeModal(); render();
}

function setInvoiceStatus(id, status){
  const inv = db.invoices.find(i => i.id === id);
  if (!inv) return;
  if (session.role === 'parent'){
    if (inv.status === 'unpaid' && status === 'pending'){ inv.status = 'pending'; saveDB(); render(); }
    return;
  }
  inv.status = status;
  saveDB(); render();
}

function deleteInvoice(id){
  if (!confirm('Hapus invoice ini?')) return;
  db.invoices = db.invoices.filter(i => i.id !== id);
  saveDB(); render();
}

/* ================= MODAL ================= */
function openModal(html){
  const ov = document.getElementById('modal');
  document.getElementById('modalContent').innerHTML = html;
  ov.classList.remove('hidden');
}
function closeModal(){
  const ov = document.getElementById('modal');
  if (ov) ov.classList.add('hidden');
}

/* ================= INIT ================= */
(async function init(){
  await loadDB();
  const saved = sessionStorage.getItem('bimbel_session');
  if (saved) session = db.users.find(u => u.username === saved) || null;
  render();
})();
</script>
</body>
</html>
